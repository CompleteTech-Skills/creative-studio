name: Continuity capability admission
on:
  push:
    branches: [main, 'agent/issue-115-capability-admission-20261024']
  pull_request:
permissions:
  contents: read
jobs:
  admission:
    name: Capability policy and real owner probes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - run: python -m unittest discover -s tests -p "test_rig_continuity_*.py" -v
      - run: python tests/continuity_capability_probe.py --destination continuity-capability-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: continuity-capabilities-${{ runner.os }}-${{ github.sha }}
          path: continuity-capability-evidence/
          include-hidden-files: true
          if-no-files-found: error
