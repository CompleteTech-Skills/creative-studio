name: Optional decomposition analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-analysis:
    name: Real local face and eye analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -p test_decomposition_analysis.py -v 2>&1 | tee analysis-core.log
      - run: python -m unittest discover -s tests/optional -p test_decomposition_analysis_backend.py -v 2>&1 | tee analysis-backend.log
        env:
          HATCH_ANALYSIS_BACKEND_TEST: '1'
      - name: Verify native Windows record handles
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests/optional -p test_decomposition_windows_records.py -v 2>&1 | tee analysis-windows-records.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: decomposition-analysis-${{ runner.os }}-${{ github.sha }}
          path: |
            analysis-core.log
            analysis-backend.log
            analysis-windows-records.log
          if-no-files-found: error
          retention-days: 30
