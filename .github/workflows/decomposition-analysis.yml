name: Optional decomposition analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-analysis:
    name: Real local face and eye analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -p test_decomposition_analysis.py -v 2>&1 | tee analysis-core.log
      - run: python -m unittest discover -s tests -p test_decomposition_analysis_backend.py -v 2>&1 | tee analysis-backend.log
        env:
          HATCH_ANALYSIS_BACKEND_TEST: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: decomposition-analysis-${{ runner.os }}-${{ github.sha }}
          path: |
            analysis-core.log
            analysis-backend.log
          if-no-files-found: error
          retention-days: 30
