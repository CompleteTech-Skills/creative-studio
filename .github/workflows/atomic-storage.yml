name: Pinned storage primitives
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  storage-locks:
    name: Storage writer lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_atomic_writer_lock.py -v 2>&1 | tee storage-locks.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: storage-locks-${{ runner.os }}-${{ github.sha }}
          path: storage-locks.log
          if-no-files-found: error
  windows-storage:
    name: Actual Windows byte reader file publisher and writer lock
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/optional -p test_atomic_storage_windows.py -v 2>&1 | tee storage-windows.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: storage-windows-${{ github.sha }}
          path: storage-windows.log
          if-no-files-found: error
