name: Lossless image sequence verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  sequence-precision:
    name: Actual PNG EXR precision and linear compositing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-sequence.txt
      - run: python -m unittest discover -s tests/optional -p test_silent_sequence_native.py -v 2>&1 | tee sequence-precision.log
      - run: python -m unittest discover -s tests/optional -p test_silent_render3d_numerical.py -v 2>&1 | tee linear-compositing.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sequence-precision-${{ github.sha }}
          path: |
            sequence-precision.log
            linear-compositing.log
          if-no-files-found: error
          retention-days: 30
