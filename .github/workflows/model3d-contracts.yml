name: Model3D contract and payload verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    name: Model3D real payloads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - run: python scripts/generate_schemas.py --check
      - run: python -m unittest discover -s tests -p 'test_model3d_*.py' -v 2>&1 | tee model3d-tests.log
      - run: python scripts/model3d.py validate --file examples/model3d-contracts/robotic.json --root . > model3d-verification.json
      - run: python scripts/model3d.py capabilities > model3d-capabilities.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: model3d-contracts-${{ runner.os }}-${{ github.sha }}
          path: |
            model3d-tests.log
            model3d-verification.json
            model3d-capabilities.json
          if-no-files-found: error
          retention-days: 30
