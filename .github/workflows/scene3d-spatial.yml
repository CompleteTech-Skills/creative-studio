name: Scene3D spatial geometry
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - run: PYTHONPATH=scripts:tests python -m unittest test_rig_scene3d_spatial test_rig_scene3d_environment test_rig_scene3d_math -v
      - run: |
          mkdir -p spatial-evidence
          python scripts/demonstrate_scene3d_spatial.py --destination spatial-evidence/rooms
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scene3d-spatial-${{ github.sha }}
          path: spatial-evidence/
          retention-days: 14
