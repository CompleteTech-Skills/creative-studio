name: Optional captured CLIPSeg model execution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  clipseg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-clipseg.txt
      - name: Provision explicit pinned snapshot and verify every file
        run: |
          python - <<'PY'
          import hashlib, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import decomposition_clipseg as clip
          root = Path('clipseg-inputs'); root.mkdir()
          for name, expected in clip.FILES.items():
              maximum = clip.MAX_MODEL_FILE_BYTES if name == 'model.safetensors' else clip.MAX_CONFIG_FILE_BYTES
              url = 'https://huggingface.co/CIDAS/clipseg-rd64-refined/resolve/' + clip.REVISION + '/' + name
              digest = hashlib.sha256(); size = 0
              with urllib.request.urlopen(url, timeout=60) as source, (root/name).open('xb') as target:
                  while True:
                      block = source.read(min(1024*1024, maximum + 1 - size))
                      if not block: break
                      size += len(block)
                      if size > maximum: raise ValueError('Pinned input exceeds bound: ' + name)
                      target.write(block); digest.update(block)
              if digest.hexdigest() != expected: raise ValueError('Pinned input differs: ' + name)
          PY
      - name: Contracts and actual immutable model execution
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_decomposition_clipseg.py -v 2>&1 | tee clipseg-contracts.log
          timeout --signal=TERM --kill-after=15s 600s python -m unittest discover -s tests/optional -p test_decomposition_clipseg_backend.py -v 2>&1 | tee clipseg-native.log
        env:
          HATCH_CLIPSEG_BACKEND_TEST: '1'
          HATCH_CLIPSEG_MODEL_DIR: ${{ github.workspace }}/clipseg-inputs
          HATCH_CLIPSEG_EVIDENCE_DIRECTORY: ${{ github.workspace }}/clipseg-evidence
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: captured-clipseg-${{ github.sha }}
          path: |
            clipseg-contracts.log
            clipseg-native.log
            clipseg-evidence
          if-no-files-found: error
          retention-days: 30
