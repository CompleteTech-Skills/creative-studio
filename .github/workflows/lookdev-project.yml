name: LookDev project closure
on: [push, pull_request]
jobs:
  source-closure:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - name: Exact closure, native export and legacy contracts
        run: python -m unittest discover -s tests -p test_lookdev_project.py -v
      - name: Legacy material and lighting contracts
        run: python -m unittest discover -s tests -p test_lookdev_contracts.py -v
