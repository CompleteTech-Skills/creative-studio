name: LookDev project closure
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  source-closure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - name: Exact closure, native export and legacy contracts
        run: python -m unittest discover -s tests -p 'test_lookdev_project.py' -v 2>&1 | tee lookdev-portable.log
      - name: Legacy material and lighting contracts
        run: python -m unittest discover -s tests -p test_lookdev_contracts.py -v 2>&1 | tee lookdev-legacy.log
      - name: POSIX exact native export and publication adversaries
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -p test_rig_lookdev_project.py -v 2>&1 | tee lookdev-native.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lookdev-project-${{ runner.os }}-${{ github.sha }}
          path: lookdev-*.log
          if-no-files-found: error
          retention-days: 30
