name: Windows handle-pinned private publication
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}
jobs:
  windows-handle-publication:
    name: Actual Windows pinned publication and SQLite
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_atomic_windows.py -v 2>&1 | tee windows-portable.log
      - run: python -m unittest discover -s tests/optional -p test_atomic_windows_native.py -v 2>&1 | tee windows-native.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-handle-publication-${{ github.sha }}
          path: |
            windows-portable.log
            windows-native.log
          if-no-files-found: error
          retention-days: 30
